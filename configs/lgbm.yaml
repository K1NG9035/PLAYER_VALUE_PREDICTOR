model_name: "lightgbm"
common_params:
  boosting_type: "gbdt"
  objective: "regression"
  metric: "rmse"
  learning_rate: 0.05
  num_leaves: 63
  max_depth: 8
  min_child_samples: 30
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  n_estimators: 1500
  early_stopping_rounds: 50
  verbose: -1
  random_state: 42
  n_jobs: -1

quantile_params:
  objective: "quantile"
  alpha_list: [0.05, 0.50, 0.95]
  learning_rate: 0.05
  num_leaves: 45
  n_estimators: 800
  early_stopping_rounds: 40
  verbose: -1
  random_state: 42
  n_jobs: -1

target_a_params:
  learning_rate: 0.04
  num_leaves: 63

target_b_params:
  learning_rate: 0.03
  num_leaves: 47
  reg_lambda: 2.0
